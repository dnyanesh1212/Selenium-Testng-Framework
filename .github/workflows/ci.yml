name: CI - Selenium TestNG Framework

# When to run CI
on:
  push:
    branches: [ "main", "develop", "feature/ci-pipeline" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Display Java & Maven version
        run: |
          java -version
          mvn -version

      - name: Run tests (Smoke Suite)
        run: mvn clean test -Dsuite=smoke -Dheadless=true

      - name: Upload Extent Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports/

